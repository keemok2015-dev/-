<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>.</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b949e;--ac:#2ea043}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.n{font-size:26px;font-weight:700}.l{color:var(--mut);font-size:13px}
input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:var(--tx);width:100%;box-sizing:border-box;margin:4px 0}
button{background:var(--ac);border:0;font-weight:600}
.row{display:flex;gap:6px}
</style>
</head>
<body>
<div id="login" class="card">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button onclick="login()">دخول</button>
</div>

<div id="app" hidden>
  <div class="grid">
    <div class="card"><div class="n" id="visits">0</div><div class="l">إجمالي الزيارات</div></div>
    <div class="card"><div class="n" id="unique">0</div><div class="l">زوار فريدون</div></div>
    <div class="card"><div class="n" id="subs">0</div><div class="l">المشتركون</div></div>
    <div class="card"><div class="n" id="rev">0</div><div class="l">الأرباح</div></div>
  </div>

  <div class="card">
    <b>تسجيل أرباح (من لوحة AdSense)</b>
    <input id="amt" type="number" step="0.01" placeholder="المبلغ">
    <input id="note" placeholder="ملاحظة (مثال: أكتوبر)">
    <button onclick="addRev()">حفظ</button>
  </div>

  <div class="card">
    <b>روابط القنوات الناقلة</b>
    <div id="chs"></div>
    <div class="row"><input id="cn" placeholder="اسم القناة"><input id="cu" placeholder="https://..."></div>
    <button onclick="addCh()">إضافة / تحديث</button>
  </div>
</div>

<script>
let token = sessionStorage.getItem("t"), channels = {};
const $ = id => document.getElementById(id);
const api = (p, body) => fetch("/api/admin/" + p, {
  method: body ? "POST" : "GET",
  headers: {authorization: "Bearer " + token, "content-type": "application/json"},
  body: body ? JSON.stringify(body) : undefined
});

async function login() {
  const r = await fetch("/api/admin/login", {method: "POST", body: JSON.stringify({password: $("pw").value})});
  if (!r.ok) return alert("خطأ");
  token = (await r.json()).token; sessionStorage.setItem("t", token); load();
}

async function load() {
  const r = await api("stats");
  if (!r.ok) { sessionStorage.removeItem("t"); return; }
  const s = await r.json();
  $("login").hidden = true; $("app").hidden = false;
  $("visits").textContent = s.visits; $("unique").textContent = s.unique;
  $("subs").textContent = s.subscribers; $("rev").textContent = s.revenueTotal.toFixed(2);
  channels = s.channels; drawCh();
}

const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function drawCh() {
  $("chs").innerHTML = Object.entries(channels).map(([n, u]) =>
    `<div class="row"><span style="flex:1">${esc(n)}</span><button style="width:auto;background:#da3633" onclick="delCh(this.dataset.n)" data-n="${esc(n)}">حذف</button></div>`).join("");
}

async function addCh() {
  const n = $("cn").value.trim(), u = $("cu").value.trim();
  if (!n || !/^https:\/\//.test(u)) return alert("أدخل اسماً ورابط https");
  channels[n] = u; await api("channels", channels); $("cn").value = $("cu").value = ""; drawCh();
}
async function delCh(n) { delete channels[n]; await api("channels", channels); drawCh(); }
async function addRev() {
  const amount = parseFloat($("amt").value); if (isNaN(amount)) return;
  await api("revenue", {amount, note: $("note").value}); $("amt").value = $("note").value = ""; load();
}
if (token) load();
</script>
</body>
</html>
